<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel — Reserva y contacto</title>
  
  <!-- Estetica, falta añadirlo a algunas cosas-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Linden+Hill:ital@0;1&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=favorite" />
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link rel="stylesheet" href="assets/css/estilos.css">
   <link rel="stylesheet" href="assets/css/inicio.css">
   <link rel="stylesheet" href="assets/css/header.css">
  <style>
    
    :root {
      --colores-principal1: #00493d;
      --colores-secundario1: #da6104;
      --colores-secundario2: #c25603;
      --colores-blanco: #ffffff;
      --colores-blanco2: #f6f2ef;
      --colores-gris1: #1f1f1f;
      --colores-gris3: #8c847d;
      --fonts-titles: "Lilita One", system-ui, sans-serif;
      --fonts-body: "Linden Hill", Georgia, serif;
      --radius-pill: 999px;
      --radius-md: 12px;
      --shadows-header: 0 2px 8px rgba(61, 43, 26, 0.08);
    }

    
    * { box-sizing: border-box; margin: 0; padding: 0; }


    /* Prueba para ver como queda en pc en simulador de pantalla */
    .form-container { 
      max-width: 800px; 
      margin: 0 auto; 
      margin-top: 20px;
      margin-bottom: 20px;
      background-color: var(--colores-blanco); 
      padding: 40px 50px; 
      border-radius: var(--radius-md); 
      box-shadow: var(--shadows-header); 
    }

    .header-form {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 { 
      font-family: var(--fonts-titles); 
      color: var(--colores-principal1); 
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--colores-gris3);
      font-size: 1.1rem;
    }

    
    .form-group { 
      margin-bottom: 20px; 
      display: flex; 
      flex-direction: column; 
    }

    label { 
      font-weight: bold; 
      margin-bottom: 8px; 
      color: var(--colores-principal1); 
      font-size: 1rem;
    }

    input, textarea { 
      padding: 12px 15px; 
      border: 1px solid var(--colores-gris3); 
      border-radius: var(--radius-md); 
      font-family: var(--fonts-body); 
      font-size: 1.1rem;
      background-color: var(--colores-blanco);
      color: var(--colores-gris1);
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--colores-secundario1);
      box-shadow: 0 0 0 2px rgba(218, 97, 4, 0.2);
    }

    
    .row { 
      display: flex; 
      gap: 20px; 
    }
    
    .row .form-group { 
      flex: 1; 
    }

    
    button { 
      background-color: var(--colores-secundario1); 
      color: var(--colores-blanco); 
      padding: 15px; 
      border: none; 
      border-radius: var(--radius-pill); 
      cursor: pointer; 
      font-size: 1.3rem; 
      font-family: var(--fonts-titles);
      width: 100%;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }

    button:hover { 
      background-color: var(--colores-secundario2); 
    }

    button:active {
      transform: scale(0.98);
    }

    /* Prueba para ver estetica en simulador de pantalla*/
    @media (max-width: 600px) {
      .row { flex-direction: column; gap: 0; }
      .form-container { padding: 20px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
     <header class="header-content" data-component="componentes/header.html"></header>

  <main class="form-container">
    <div class="header-form">
      <h1>Reserva y contacto</h1>
      <p class="subtitle">Completa el formulario para asegurar tu estadía.</p>
    </div>

    <form action="php/procesar_reserva.php" method="POST">
      
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre">
      </div>

      <div class="row">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono">
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="fecha_entrada">Fecha de Entrada</label>
          <input type="date" id="fecha_entrada" name="fecha_entrada" required>
        </div>

        <div class="form-group">
          <label for="fecha_salida">Fecha de Salida</label>
          <input type="date" id="fecha_salida" name="fecha_salida" required>
        </div>
      </div>

      <div class="form-group">
        <label for="huespedes">Número de Huéspedes</label>
        <input type="number" id="huespedes" name="huespedes" min="1" max="100">
      </div>

      <div class="form-group">
        <label for="comentarios">Peticiones especiales (Opcional)</label>
        <textarea id="comentarios" name="comentarios" rows="4" placeholder="Peticiones especiales del huesped..."></textarea>
      </div>

      <button type="submit">Enviar Reserva</button>
    </form>
  </main>

  <script src="assets/vendor/jquery/jquery.min.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/showMenu.js"></script>
</body>
</html>
